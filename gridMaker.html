<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper Board Shape Editor</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: monospace;
    }
    body {
      background: #1e1e1e;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    h1 {
      margin: 0 0 10px 0;
      color: #ffd700;
    }
    .controls {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 20px;
      background: #2a2a2a;
      padding: 12px 20px;
      border-radius: 8px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    input[type="number"] {
      width: 60px;
      background: #111;
      border: 1px solid #555;
      color: #0f0;
      padding: 4px;
      border-radius: 4px;
      text-align: center;
    }
    button {
      background: #007acc;
      color: white;
      border: none;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
    }
    button:hover {
      background: #005999;
    }
    .btn-copy {
      background: #27ae60;
    }
    .btn-copy:hover {
      background: #1e8449;
    }
    .grid-container {
      display: grid;
      gap: 2px;
      background: #333;
      padding: 4px;
      border-radius: 4px;
      user-select: none;
      max-width: 90vw;
      max-height: 60vh;
      overflow: auto;
    }
    .cell {
      width: 32px;
      height: 32px;
      background: #4a90e2;
      border: 1px solid #2a62a7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      cursor: pointer;
    }
    .cell.null-tile {
      background: #222;
      border-color: #111;
      color: #555;
    }
    .output-box {
      width: 100%;
      max-width: 800px;
      margin-top: 20px;
    }
    textarea {
      width: 100%;
      height: 120px;
      background: #111;
      color: #0f0;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 10px;
      font-family: monospace;
      resize: vertical;
    }
  </style>
</head>
<body>

  <h1>Grid Shape Editor</h1>
  <p style="color: #aaa; margin-top: 0;">Click or drag to toggle tiles into <code>null</code>.</p>

  <div class="controls">
    <label>Rows: <input type="number" id="rowsInput" value="16" min="1" max="50"></label>
    <label>Cols: <input type="number" id="colsInput" value="16" min="1" max="50"></label>
    <button onclick="generateGrid()">Reset Board</button>
    <button class="btn-copy" onclick="copyNullCoords()">Copy Null Coords</button>
  </div>

  <div id="grid" class="grid-container"></div>

  <div class="output-box">
    <label style="margin-bottom: 6px; display: block;">Null Cell Coordinates:</label>
    <textarea id="output" readonly></textarea>
  </div>

  <script>
    let rows = 16;
    let cols = 16;
    let isMouseDown = false;
    let toggleTargetState = false; // true = make null, false = make active

    document.addEventListener('mousedown', () => isMouseDown = true);
    document.addEventListener('mouseup', () => isMouseDown = false);

    function generateGrid() {
      rows = parseInt(document.getElementById('rowsInput').value);
      cols = parseInt(document.getElementById('colsInput').value);
      
      const gridContainer = document.getElementById('grid');
      gridContainer.innerHTML = '';
      gridContainer.style.gridTemplateColumns = `repeat(${cols}, 32px)`;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.row = r;
          cell.dataset.col = c;
          
          cell.addEventListener('mousedown', (e) => {
            e.preventDefault();
            cell.classList.toggle('null-tile');
            toggleTargetState = cell.classList.contains('null-tile');
            updateOutput();
          });

          cell.addEventListener('mouseenter', () => {
            if (isMouseDown) {
              if (toggleTargetState) {
                cell.classList.add('null-tile');
              } else {
                cell.classList.remove('null-tile');
              }
              updateOutput();
            }
          });

          gridContainer.appendChild(cell);
        }
      }
      updateOutput();
    }

    function getNullCoords() {
      const nullCells = document.querySelectorAll('.cell.null-tile');
      const coords = [];
      nullCells.forEach(cell => {
        coords.push({
          row: parseInt(cell.dataset.row),
          col: parseInt(cell.dataset.col)
        });
      });
      return coords;
    }

    function updateOutput() {
      const coords = getNullCoords();
      document.getElementById('output').value = JSON.stringify(coords, null, 2);
    }

    function copyNullCoords() {
      const output = document.getElementById('output');
      output.select();
      navigator.clipboard.writeText(output.value);
      alert('Copied null cell coordinates to clipboard!');
    }

    // Initialize on load
    generateGrid();
  </script>

</body>
</html>
