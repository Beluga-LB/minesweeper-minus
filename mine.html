<!DOCTYPE html>
<html>
  <head>
    <!--<base href="https://cdn.jsdelivr.net/gh/Beluga-LB/minesweeper-minus@main/">-->
    <!--<base href="https://raw.githubusercontent.com/Beluga-LB/minesweeper-minus/main/">-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      width: auto;
      height: auto;   
      max-width: 100%; 
      max-height: 100%; 
      image-rendering: pixelated;
    }
    </style>
  </head>
  <body>
    <div id="loaderOverlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999; font-family: monospace; padding: 20px; box-sizing: border-box;">
      <h2 style="margin-bottom: 10px;">Loading Minesweeper Minus...</h2>
      <div id="loadProgress" style="font-size: 20px; margin-bottom: 15px;">0 / 0 Assets Loaded</div>
      
      <div id="loadConsole" style="width: 80%; max-width: 600px; height: 150px; background: #000; border: 1px solid #444; padding: 10px; overflow-y: auto; font-size: 14px; text-align: left; margin-bottom: 15px; border-radius: 4px; color: #0f0;">
          [System] Initializing asset preloader...<br>
      </div>

      <button id="skipBtn" onclick="forceStartGame()" style=" padding: 10px 20px; background: #e74c3c; color: white; border: none; font-family: monospace; font-size: 16px; cursor: pointer; border-radius: 4px;">Skip Loading (Errors Detected)</button>
    </div>
    <canvas id="game" width="1000" height="1000"></canvas>
  </body>
  <script src="helpers.js"></script>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const consoleBox = document.getElementById('loadConsole');
    const progressText = document.getElementById('loadProgress');
    const skipBtn = document.getElementById('skipBtn');

    const aud = {
      flag: new Audio('aud/flag_sound.ogg'),
      unflag: new Audio('aud/unflag_sound.mp3'),
      sonarClick: new Audio('aud/sfx_click.ogg'),
      sonar: new Audio('aud/sfx_radar.mp3'),
      mine: new Audio('aud/explosion.ogg'),
      
      nineMove: new Audio('aud/sfx_move.ogg'),
      nineStop: new Audio('aud/sfx_stop.ogg'),
      // tenBounce: new Audio('aud/bounce.ogg'),
      

      tenBounce: new Audio('aud/bounce.ogg'),
      tenBeep: new Audio('aud/beep.ogg'),
      tenReset: new Audio('aud/reset.ogg'),
    }
    const mus = {
      zero: new Audio('mus/bgm_9.mp3'),
      one: new Audio('mus/bgm_1.mp3'),
      oneWin: new Audio('mus/win_1.mp3'),
      oneMenu: new Audio('mus/game_select_1.mp3'),
      two: new Audio('mus/bgm_2.mp3'),
      twoWin: new Audio('mus/win_2.mp3'),
      twoMenu: new Audio('mus/game_select_2.mp3'),
      three: new Audio('mus/bgm_3.mp3'),
      threeWin: new Audio('mus/win_3.mp3'),
      threeMenu: new Audio('mus/game_select_3.mp3'),
      four: new Audio('mus/bgm_4.mp3'),
      fourWin: new Audio('mus/win_4.mp3'),
      fourMenu: new Audio('mus/game_select_4.mp3'),
      five: new Audio('mus/bgm_5.mp3'),
      fiveWin: new Audio('mus/win_5.ogg'),
      fiveMenu: new Audio('mus/game_select_5.mp3'),
      six: new Audio('mus/bgm_6.mp3'),
      sixWin: new Audio('mus/win_6.ogg'),
      sixMenu: new Audio('mus/game_select_6.mp3'),
      seven: new Audio('mus/bgm_7.mp3'),
      sevenWin: new Audio('mus/win_7.ogg'),
      sevenMenu: new Audio('mus/game_select_7.mp3'),
      eight: new Audio('mus/bgm_8.mp3'),
      eightWin: new Audio('mus/win_8.ogg'),
      eightMenu: new Audio('mus/game_select_8.mp3'),
      nineIntro: new Audio('mus/9_intro.mp3'),
      nine: new Audio('mus/9_boss.mp3'),
      nineWin: new Audio('mus/9_fanfare.ogg'),
      nineMenu: new Audio('mus/game_select_9.mp3'),
      tenIntro: new Audio('mus/10_intro.mp3'),
      ten: new Audio('mus/10_boss.mp3'),
      ten2: new Audio('mus/10_boss_2.mp3'),
      tenWin: new Audio('mus/10_fanfare.ogg'),
      tenMenu: new Audio('mus/game_select_10.mp3'),
      elevenIntro: new Audio('mus/11_intro.mp3'),
      eleven: new Audio('mus/11_boss.mp3'),
      eleven2: new Audio('mus/11_boss_2.mp3'),
      elevenWin: new Audio('mus/11_fanfare.ogg'),
      elevenMenu: new Audio('mus/game_select_11.mp3'),
    }
    mus.nine.loopStart = 11.0;
    mus.nineIntro.loopStart = 26.7;
    mus.tenIntro.loopStart = 23.7;
    mus.elevenIntro.loopStart = 43.2;
    for (let i in aud) {
      aud[i].oncanplaythrough = () => {
        logToConsole(`Loaded audio: ${i}`);
        updateProgress();
        aud[i].oncanplaythrough = null; // Prevent multi-firing
      };
      aud[i].onerror = () => {
        hasErrors = true;
        logToConsole(`[ERROR] Failed to load audio: ${i}`, true);
        skipBtn.style.display = 'block';
        updateProgress();
      };
      setTimeout(() => {
        if (aud[i].readyState < 2 && !aud[i].error) {
          logToConsole(`[TIMEOUT] ${i} took too long to load`)
        }
      }, 3000);
    }
    for (let i in mus) {
      if (!i.includes("Win")) mus[i].loop = true;
      if ((i.includes("nine") || i.includes("ten") || i.includes("eleven")) && (!i.includes("Win") || !i.includes("Intro")))  mus[i].preservesPitch = false;
    
      const track = mus[i];
      if (track.loopStart) {
        track.loop = false; 
        track.addEventListener('ended', () => {
          track.currentTime = track.loopStart;
          track.play().catch(e => console.log("Loop blocked:", e));
        });
      }

      mus[i].oncanplaythrough = () => {
        logToConsole(`Loaded music: ${i}`);
        updateProgress();
        mus[i].oncanplaythrough = null;
      };
      mus[i].onerror = () => {
        hasErrors = true;
        logToConsole(`[ERROR] Failed to load music: ${i}`, true);
        skipBtn.style.display = 'block';
        updateProgress();
      };
    }

    const img = {
      ButtonA: new Image(),
      ButtonB: new Image(),
      ButtonC: new Image(),
      ButtonD: new Image(),
      mineCounter1: new Image(),
      mineCounter2: new Image(),
      clock1: new Image(),
      clock2: new Image(),
      tenBody: new Image(),
      tenPiston: new Image(),
      flags: new Image(),
      Numbers: new Image(),
      NumbersNegative: new Image(),
      nine: new Image(),
      nineSpikes: new Image(),
      Numbers10: new Image(),
      water: new Image(),
      white_outline: new Image(),
      outline_blocks: new Image(),
      outline_blocks_alt: new Image(),
    }
    for (let i in img) {
      img[i].src = `img/${i}.png`;
      img[i].onload = () => {
        logToConsole(`Loaded image: img/${i}.png`);
        updateProgress();
      };
      img[i].onerror = () => {
        hasErrors = true;
        logToConsole(`[ERROR] Failed to load image: img/${i}.png`, true);
        skipBtn.style.display = 'block';
        updateProgress();
      };
    }

    let totalAssets = Object.keys(img).length + Object.keys(aud).length + Object.keys(mus).length;
    let loadedAssets = 0;
    let hasErrors = false;

    function logToConsole(text, isError = false) {
      console.log(text);
      if (consoleBox) {
        consoleBox.innerHTML += `<span style="color: ${isError ? '#ff5555' : '#0f0'}">${text}</span><br>`;
        consoleBox.scrollTop = consoleBox.scrollHeight;
      }
    }

    function updateProgress() {
      loadedAssets++;
      progressText.innerText = `${loadedAssets} / ${totalAssets} Assets Loaded`;
      if (loadedAssets >= totalAssets) {
        finishLoading();
      }
    }

    function finishLoading() {
      logToConsole("[System] Starting game...");
      setTimeout(() => {
        const overlay = document.getElementById('loaderOverlay');
        if (overlay) overlay.style.display = 'none';
      }, 500);
    }

    function forceStartGame() {
      const overlay = document.getElementById('loaderOverlay');
      if (overlay) overlay.style.display = 'none';
      logToConsole("[System] Force-starting game despite missing assets.");
    }

    let state = {};
    let permState = {
      mouse: {
        x: 0,
        y: 0,
        r: 1, // collision purposes
      },
      menu: "main",
      mode: "debug",
      master: false,
      stage: 1,
      lives: 3,
      shields: 0,
      coins: 1050,
      clock: 0,
    };
    let loopId;
    let started = false;

    const maps = { // rows, cols, mines
      beginner: [
        [],
        [],
        [],
        [],
        [],
        [],
        [],
        [],
        [],
      ],
      novice: [
        [],
        [],
        [],
        [],
        [],
        [],
        [],
        [],
        [],
      ],
      advanced: [
        [],
        [],
        [],
        [],
        [],
        [],
        [],
        [],
        [],
      ],
      expert: [
        [],
        [],
        [],
        [],
        [],
        [],
        [],
        [],
        [13, 19, 48],
      ],
    }

    const buttons = {
      A: {
        x: 100,
        y: 128,
        w: 448,
        h: 512
      }
    }
    
    const flagRow = [1,2,3,-1,-2,-3,9]

    const outlineColor = [
      0,
      1,
      2,
      3,
      8, // Nine
      4,
      5,
      6,
      7,
      9, // Ten
      10, // Eleven
    ]

    const bgmTheme = {
      one: 0,
      two: 1,
      three: 2,
      four: 3,
      five: 5,
      six: 6,
      seven: 7,
      eight: 8,
      nine: 4,
      ten: 9,
      eleven: 10,
    }

    class bossNine {
      constructor()  {
        this.active = true;
        this.revealed = false;
        this.timer = 999;
        this.timerCD = 60;
        this.row = null;
        this.col = null;
        this.moveCD = 10;
        this.thinkCD = 0;
        this.destination = null;
      }

      get x() {
        return this.col * state.cellSize;
      };
      get y() {
        return this.row * state.cellSize;
      };
      cell(cell) {
        return this.row === cell.row && this.col === cell.col && state.nine.active; 
      };
      click() {
        if (!state.clicked) placeMines();
        if (checkWin()) gameOver(true);
        else gameOver(false);
      };
      move(dir, test) {
        let oldFlags = [];
        state.grid[this.row][this.col].opened = false;
        state.grid[this.row][this.col].flagged = false;
        state.grid[this.row][this.col].mine = true;
        for (let i = this.row - 1; i <= this.row + 1; i++) {
          if (!state.grid[i]) continue;
          const r = i - this.row + 1;
          oldFlags[r] = [];
          for (let j = this.col - 1; j <= this.col + 1; j++) {
            if (!state.grid[i][j] || this.cell(state.grid[i][j])) continue;
            const c = j - this.col + 1;
            state.grid[i][j].mine = 0; 
            oldFlags[r][c] = state.grid[i][j].flagged;
            state.grid[i][j].flagged = false;
          }
        }
        let oob = false;
        for (let i=-1; i<=1; i++) {
          if (dir === "left") {
            const moving = state.grid[this.row + i][this.col - 2];
            if (!moving) {
              oob = true;
              break;
            }
            const target = state.grid[this.row + i][this.col + 1];
            target.opened = moving.opened;
            target.mine = moving.mine;
            if (!moving.mine) moving.flagged = false;
          } else if (dir === "right") {
            const moving = state.grid[this.row + i][this.col + 2];
            if (!moving) {
              oob = true;
              break;
            }
            const target = state.grid[this.row + i][this.col - 1];
            target.opened = moving.opened;
            target.mine = moving.mine;
            if (!moving.mine) moving.flagged = false;
          } else if (dir === "down") {
            const moving = state.grid[this.row + 2][this.col + i];
            if (!moving) {
              oob = true;
              break;
            }
            const target = state.grid[this.row - 1][this.col + i];
            target.opened = moving.opened;
            target.mine = moving.mine;
            if (!moving.mine) moving.flagged = false;
          } else if (dir === "up") {
            const moving = state.grid[this.row - 2][this.col + i];
            if (!moving) {
              oob = true;
              break;
            }
            const target = state.grid[this.row + 1][this.col + i];
            target.opened = moving.opened;
            target.mine = moving.mine;
            if (!moving.mine) moving.flagged = false;
          }
        }
        if (oob) {
          this.destination = null;
        } else {
          if (dir === "left") this.col--;
          else if (dir === "right") this.col++;
          else if (dir === "up")  this.row--;
          else if (dir === "down") this.row++;
        }
        for (let i = this.row - 1; i <= this.row + 1; i++) {
          if (!state.grid[i]) continue;
          const r = i - this.row + 1;
          for (let j = this.col - 1; j <= this.col + 1; j++) {
            if (!state.grid[i][j]) continue;
            const c = j - this.col + 1
            state.grid[i][j].mine = 1; 
            state.grid[i][j].opened = false;
            state.grid[i][j].flagged = oldFlags[r][c];
          }
        }

        if (oob) return;
        if (state.grid[this.row][this.col] === this.destination) play("nineStop");
        else play("nineMove");
        state.shake += 1
      };
    
      reveal(cell) {
        this.row = cell ? cell.row : Math.floor(state.rows / 2);
        this.col = cell ? cell.col : Math.floor(state.cols / 2);
        this.revealed = true; 
        for (let i = this.row - 1; i <= this.row + 1; i++) {
          if (!state.grid[i]) continue;
          for (let j = this.col - 1; j <= this.col + 1; j++) {
            if (!state.grid[i][j] || i === this.row && j === this.col) continue;
            state.grid[i][j].mine = 1; 
          }
        }
        for (let i in mus) {
          mus[i].pause();
          mus[i].currentTime = 0; 
        }  
        if (!state.suprise) mus.nineIntro.play();
        state.bgm = "nine";
      } 
    }

    class bossTen {
      constructor() {
        this.active = true;
        this.revealed = false;
        this.activated = false;
        this.debug = false;
        this.time = 10;
        this.x = canvas.width / 2;
        this.y = canvas.height / 2;
        this.r = 50;
        this.speed = 0;
        this.angle = 0;
        this.beepcd = 0;
        this.pistoncd = 0;
        this.shake = 0;
        this.shakeOffset = 0;
      }
      click() {
        play("tenReset")
        if (!this.activated) this.activated = true;
        this.time = 10;
        this.speed += 0.2;
        this.angle = Math.random() * Math.PI * 2;
      };
      reveal(cell) {
        if (cell) {
          this.x = cell.col * state.cellSize + state.cellSize / 2;
          this.y = cell.row * state.cellSize + state.cellSize / 2 + 100;
        }
        this.revealed = true;
        state.ten.revealed++;
        for (let i in mus) {
          mus[i].pause();
          mus[i].currentTime = 0; 
        }  
        if (!state.suprise) mus.tenIntro.play();
        state.bgm = "ten";
      }
    }
    
    window.addEventListener('mousemove', (e) => {
      if (!started) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      permState.mouse.x = (e.clientX - rect.left) * scaleX;
      permState.mouse.y = (e.clientY - rect.top) * scaleY;
      if (permState.menu !== "game") return;
      state.mouse.zoomX = (state.mouse.x - canvas.width / 2) / state.cam.zoom + canvas.width / 2 - state.cam.x;
      state.mouse.zoomY = (state.mouse.y - canvas.height / 2) / state.cam.zoom + canvas.height / 2 - state.cam.y;
      
      const c = Math.floor(state.mouse.zoomX / state.cellSize);
      const r = Math.floor((state.mouse.zoomY - 100) / state.cellSize);
      const cell = state.grid[r]?.[c];
      if (state.pressedCell && state.pressedCell !== cell) state.pressedCell = cell;
    });
    
    canvas.addEventListener('mousedown', (e) => {
      if (!started || permState.menu !== "game") return;
      let overTen = false;
      for (let i=0; i<state.ten?.amount; i++) {
        if (checkCircleCollision(state.ten.tens[i], state.mouse)) overTen = true;
      }
      if (!started || (state.ten.active && overTen) || state.over) return;
      const c = Math.floor(state.mouse.zoomX / state.cellSize);
      const r = Math.floor((state.mouse.zoomY - 100) / state.cellSize);
      const cell = state.grid[r]?.[c];
      
      if (cell && state.pressedCell !== cell) {
        state.pressedCell = cell;
        draw();
      }
    });
    
    window.addEventListener('mouseup', () => {
      if (state.over) return;
      if (state.pressedCell) state.pressedCell = null;
    });

    canvas.addEventListener('click', (e) => {
      if (!started) {
        start();
        return;
      } else if (permState.menu === "main") {
        if (checkCircleRectCollision(permState.mouse, buttons.A)) init();
        return;
      }
      if (state.over) return;
      let overTen = false;
      let specificTens = [];
      for (let i=0; i<state.ten?.amount; i++) {
        if (checkCircleCollision(state.ten.tens[i], state.mouse)) {
          overTen = true;
          specificTens.push(i);
        }
      }
      if (state.ten?.revealed >= state.ten?.amount && overTen) {
        for (let i=0; i<state.ten?.amount; i++) if (specificTens.includes(i)) state.ten.tens[i].click();
        return;
      };
      const sonar = {
        x: canvas.width / 2 - 100,
        y: 0,
        w: 50,
        h: 100
      }
      if (checkCircleRectCollision(state.mouse, sonar)) state.useSonar();
      const c = Math.floor(state.mouse.zoomX / state.cellSize);
      const r = Math.floor((state.mouse.zoomY - 100) / state.cellSize);
      const cell = state.grid[r]?.[c];
      if (!cell) return;
      if (state.nine.cell(cell)) {
        state.nine.click();
        return;
      };

      if (!state.clicked) {
        if (state.nine.active && !state.nine.revealed) {
          state.nine.reveal(cell);
        } else if (state.ten.active && state.ten.revealed < state.ten.amount && !state.nine.cell(cell)) {
          for (let i=0; i<state.ten.amount; i++) {
            if (!state.ten.tens[i].revealed) {
              state.ten.tens[i].reveal(cell);
              break;
            };
            console.log(i)
          }
          return;
        } /*else if (state.eleven.active && !state.eleven.revealed) {

        } */else placeMines(cell)
      };
      cell.open();
      draw();
    });

    canvas.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (state.over || !started || permState.menu !== "game") return;

      let overTen = false;
      let specificTens = [];
      for (let i=0; i<state.ten?.amount; i++) {
        if (checkCircleCollision(state.ten.tens[i], state.mouse)) {
          overTen = true;
          specificTens.push(i);
        }
      }
      if (state.ten?.revealed >= state.ten?.amount && overTen) {
        for (let i=0; i<state.ten?.amount; i++) if (specificTens.includes(i)) state.ten.tens[i].click();
        return;
      };
      const c = Math.floor(state.mouse.zoomX / state.cellSize);
      const r = Math.floor((state.mouse.zoomY - 100) / state.cellSize);
      const cell = state.grid[r]?.[c];
      if (!cell) return;
    
      cell.flag();
      draw();
    });
    
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (permState.menu !== "game") return;

      const zoomIntensity = 0.1;
      if (e.deltaY < 0) {
        state.cam.zoom = Math.min(state.cam.zoom + zoomIntensity, 3.0);
      } else {
        state.cam.zoom = Math.max(state.cam.zoom - zoomIntensity, 0.5);
      }
    }, { passive: false });
    
    const keys = {};

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      keys[key] = true;

      if (key === "z") state.useSonar();
      if ((e.key === " " || e.code === "Space") && state.over) init();
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    function openCell(cell, comeFromChord = false, comeFromSpread = false) {
      if (!cell) return;
      if (cell.flagged || (comeFromChord && cell.opened)) return;
      if (cell.opened) {
        if (state.chording && !comeFromSpread) chordCell(cell, comeFromSpread);
        return;
      };
      
      if (state.sonar) { 
        play("sonar");
        state.sonar = false;
        state.coins -= state.sonarCost;
        state.sonarCost += 50
        if (cell.mine) {
          cell.flag();
          return;
        }
      }
      
      if (cell.mine) {
        cell.flagged = cell.mine;
        cell.hit = cell.mine;
        state.fails++;
        play("mine")
        state.shake += 30;
        if (state.eleven.active) {
          state.eleven.lastPenalty += 2;
          state.eleven.penalty += state.eleven.lastPenalty;
        };
        if (state.fails >= 3 && !state.boss) gameOver();
      };
      cell.opened = true;
      
      if (cellValue(cell, false, true) === 0) {
        const r = cell.row;
        const c = cell.col;
        for (let i = r - 1; i <= r + 1; i++) {
          if (!state.grid[i]) continue;
          for (let j = c - 1; j <= c + 1; j++) {
            if (!state.grid[i][j]) continue;
            const neighbor = state.grid[i][j];
            openCell(neighbor, false, true);
          }
        }
      }
      if (checkWin() && !state.nine.active) gameOver(true);
    }
    
    function chordCell(cell, comeFromSpread = false) {
      // why are antis so hard to code :<
      const visMines = cellValue(cell, false, false);
      const absMines = cellValue(cell, false, true);
      const visFlags = cellValue(cell, true, false);
      const absFlags = cellValue(cell, true, true);
      const m = comeFromSpread && visMines === 0 ? absMines : visMines;
      const f = comeFromSpread && visMines === 0 ? absFlags : visFlags;

      if (f !== m || cell.flagged) return;

      const r = cell.row;
      const c = cell.col;
      for (let i = r - 1; i <= r + 1; i++) {
        if (i < 0 || i >= state.rows) continue;
        for (let j = c - 1; j <= c + 1; j++) {
          if (j < 0 || j >= state.cols) continue;
            openCell(state.grid[i][j], true);
        }
      }
    }

    function flagCell(cell) {
      if (cell.opened) return;
      cell.flagged += cell.flagged < 0 ? -1 : 1;
      if (state.antiProb >= 1 && cell.flagged > 0) cell.flagged = -1;
      if (state.doubleProb >= 1) {
        cell.flagged *= 2;
      }
      if (cell.flagged > state.flags || cell.flagged < -state.flags) {
        if (state.antiProb > 0 && cell.flagged > state.flags) cell.flagged = -1;
        else cell.flagged = 0;
        if (state.doubleProb >= 1) cell.flagged *= 2;
      }
      if (cell.flagged === 0) {
        play("unflag");
        if (state.eleven.active && cell.mine) cell.open();
      }
      else play("flag");
    } 

    function checkWin() {
      for (let i = 0; i < state.rows; i++) {
        for (let j = 0; j < state.cols; j++) {
          const cell = state.grid[i]?.[j];
          if (!cell || cell.mine) continue;
          if (!cell.opened) return false;
        }
      }
      return true;
    }

    function gameOver(win = false) {
      if (state.over) return;
      if (win) state.won = true;
      else state.lost = true;
      if (state.ten.active) for (let i=0; i<state.ten.amount; i++) state.ten.time = win ? 10 : 0;
      for (let i in mus) {
        mus[i].pause();
        mus[i].currentTime = 0; 
      }  
      if (state.won) mus[state.bgm + "Win"].play();
      state.completionTime = state.clock;

      for (let i = 0; i < state.rows; i++) {
        if (!state.grid[i]) continue;
        for (let j = 0; j < state.cols; j++) {
          if (!state.grid[i][j]) continue;
          const cell = state.grid[i][j];
          if (state.won && cell.mine && !cell.flagged) cell.flagged = cell.mine;
          if (state.lost && cell.mine && !cell.flagged) cell.opened = true;
        }
      }
    }

    function cellValue(cell, flags = false, anti = false) {
      if (!cell || (!cell.opened && !cell.flagged)) return "";
      if (state.nine.active && cell === state.grid[state.nine.row][state.nine.col]) return 9;
      if (cell.mine && cell.opened) {
        let Xs = "";
        for (let i = 0; i < Math.abs(cell.mine); i++) Xs += "X";
        return Xs;
      }
      if (cell.flagged) {
        let Fs = "";
        for (let i = 0; i < Math.abs(cell.flagged); i++) Fs += "F";
        return Fs;
      }
      
      const r = cell.row;
      const c = cell.col;
      let count = 0;
      for (let i = r - 1; i <= r + 1; i++) {
        if (i < 0 || i >= state.rows) continue;
        for (let j = c - 1; j <= c + 1; j++) {
          const neighbor = state.grid[i][j];
          if (!neighbor || j < 0 || j >= state.cols || neighbor === cell) continue;
          if (anti) {
            if (neighbor.mine && !flags) count += Math.abs(neighbor.mine);
            else if (neighbor.flagged && flags) count += Math.abs(neighbor.flagged);
          } else {
            if (neighbor.mine && !flags) count += neighbor.mine;
            else if (neighbor.flagged && flags) count += neighbor.flagged;
          }
        }
      }
      return count;
    }

    function placeMines(cell) {
      if (!cell) return;
      if (state.clicked) return;
      state.clicked = true;
      if (!state.suprise && state.boss) {
        for (let i in mus) {
          mus[i].pause();
          mus[i].currentTime = 0; 
        }  
      }
      
      let m = state.nine.active ? 8 : 0;
      while (m < state.mines) {
        const r = Math.floor(Math.random() * state.rows);
        const c = Math.floor(Math.random() * state.cols);
        const mine = state.grid[r][c];
        if (!mine) continue;
        let near = cell ? Math.abs(r - cell.row) <= 1 && Math.abs(c - cell.col) <= 1 : false;
        if (cell) {
          if ((state.rows <= 3 && state.cols <= 3) || state.firstClick === 1) near = r === cell.row && c === cell.col
          if (state.rows * state.cols <= state.mines || state.firstClick === 0) near = false;
        }
        if (!mine.mine && !near) {
          mine.mine = Math.random() < state.doubleProb ? 2 : 1;
          if (Math.random() < state.antiProb) mine.mine = -mine.mine;
          m++;
        }
        if (!state.suprise && state.boss) mus[state.bgm].play();
      }
    }

    function play(sound) {
      const soundClone = aud[sound].cloneNode();
      soundClone.volume = 1;
      soundClone.play();
    }
    
    function draw() {

            sx, sy, tileSize, tileSize,

          )

          if (!state.grid[r]?.[c - 1]) {
            ctx.drawImage(
              img.outline_blocks,
              (2 * outlineTheme) * outlineSize, 0, outlineSize - 1, 16 * outlineSize,
              x, y, state.cellSize / 16, state.cellSize
            )
          }
          if (!state.grid[r]?.[c + 1]) {
            ctx.drawImage(
              img.outline_blocks,
              (2 * outlineTheme) * outlineSize, 0, outlineSize - 1, 16 * outlineSize,
              x + state.cellSize, y, state.cellSize / 16, state.cellSize
            )
          }
          if (!state.grid[r + 1]?.[c]) {

              0, (2 * outlineTheme) * outlineSize, outlineSize * 16, outlineSize - 1,

            )
          }

              0, (2 * outlineTheme) * outlineSize, outlineSize * 16, outlineSize - 1,
              x, y, state.cellSize, state.cellSize / 16
            )
          }

            let sy = row * tileSize;

              x + 4, y + 4, state.cellSize - 8, state.cellSize - 8
            )
          } else if ((img.Numbers && value >= 0) || (img.NumbersNegative && value <= 0)) {
            const visValue = cellValue(cell, false, false);
            const absValue = cellValue(cell, false, true);

            if ((visValue === 0 && absValue > 0) || visValue < 0) anti = "Negative";

            const num = Math.abs(visValue);
            const tileSize = 64;
            const col = num % 4;
            const row = Math.floor(num / 4);
            const sx = col * tileSize;
            const sy = row * tileSize;
            const sheet = img["Numbers" + anti];

            if (cell.opened) {

                ctx.drawImage(
                  sheet,
                  sx, sy, tileSize, tileSize,
                  x + 2, y + 2, state.cellSize - 4, state.cellSize - 4
                );
              }
            }
          } else if (cell.flagged !== 0 && img.flags && !cell.opened) {

            let row = 0;
            if (cell.flagged === 1) row = 0;
            else if (cell.flagged === 2) row = 1;
            else if (cell.flagged === 3) row = 2;
            else if (cell.flagged === -1) row = 3;
            else if (cell.flagged === -2) row = 4;
            else if (cell.flagged === -3) row = 5;

            let tileSize = 64;
            let sx = col * tileSize;
            let sy = row * tileSize;
            ctx.drawImage(
              img.flags,
              sx, sy, tileSize, tileSize,
              x + 4, y + 4, state.cellSize - 8, state.cellSize - 8
            )
          }
        }
      }
      if (state.nine.revealed && !state.won) {
        const nineCell = state.grid[state.nine.row][state.nine.col];
        const target = state.grid[state.nine.row][state.nine.col + 2];
        const moving = state.grid[state.nine.row][state.nine.col - 1];

        ctx.save();
          const size = state.cellSize * 3
          ctx.translate(state.nine.x + state.cellSize / 2, state.nine.y + state.cellSize / 2); 
          ctx.rotate(degToRad(state.clock)); 
          if (img.nineSpikes) ctx.drawImage(img.nineSpikes, -size / 2, -size / 2, size, size); 
        ctx.restore();
        if (img.nine) ctx.drawImage(
                        img.nine,
                        0, 0, 384, 384,
                        state.nine.x - state.cellSize, state.nine.y - state.cellSize, state.cellSize * 3, state.cellSize * 3
                      )
      }
      ctx.translate(0,-100);
      ctx.restore();
      rect(0,0,canvas.width, 100, silver, charcoal)
      rect(canvas.width / 2 - 50, 0, 100, 100, gold, charcoal);
      rect(canvas.width / 2 - 100, 0, 50, 100, state.sonar ? emerald : charcoal, charcoal);
      rect(canvas.width / 2 + 50, 0, 50, 100, state.livesColor(3 - state.fails, 3), charcoal);
      
      rect(0, 0, 240 ,100 , charcoal, silver)
      if (img.mineCounter1 && img.mineCounter2) ctx.drawImage(img[`mineCounter${((Math.floor(state.clock / 30) + 1) % 2) + 1}`], 0, 0, 100, 100)
      const m = state.minesLeft === "???" ? state.minesLeft : Math.min(999, Math.max(-99, state.minesLeft));
      const dm = m < 0 ? `-${String(Math.abs(m)).padStart(2, '0')}` : String(m).padStart(3, '0');
      text(dm, 110, 55, red, 72, "sans-serif", "left", "middle", "#FFF", 4)     
      
      rect(240, 0, 240 ,100 , charcoal, silver)
      text(`\$${Math.min(9999, state.coins)}`, 250, 55, "#FFF", 72, "monospace", "left", "middle")
      
      rect(canvas.width - 230, 0, 230 ,100 , charcoal, silver)
      if (img.clock1 && img.clock2) ctx.drawImage(img[`clock${((Math.floor((state.clock) / 30) + 1) % 2) + 1}`], canvas.width - 230, 0, 100, 100)
      const t = String(Math.min(999, Math.max(0, state.nine.revealed ? state.nine.timer : Math.floor((state.over ? state.completionTime : state.clock) / 60)))).padStart(3, '0')
      text(t, canvas.width - 10, 55, red, 72, "sans-serif", "right", "middle", "#FFF", 4)
      
      for (let i = 0; i<state.ten.amount; i++) {
        const boss = state.ten.tens[i];
        if (boss.revealed) {
          if (img.tenPiston) {
            ctx.save();
              ctx.filter = 'brightness(200%)';
              ctx.translate(boss.x, boss.y);
              for (let i = 0; i < 5; i++) {
                const basePattern = [1, 2, 1, 0];
                const altPattern  = [1, 0, 1, 2];
                let speed = 4;
                if (Math.ceil(boss.time) <= 4) speed *= Math.ceil(boss.time) + (4 - Math.ceil(boss.time)) * 3
                
                let patternIndex = Math.floor(boss.time * speed) % basePattern.length;
                
                let scaleState;
                scaleState = i % 2 === 0 ? basePattern[patternIndex] : altPattern[patternIndex];
                
                const w = boss.r * 4;
                let h = w;
                if (scaleState === 0) h -= 30;
                if (scaleState === 2) h += 30;
                
                ctx.drawImage(img.tenPiston, -boss.r * 2, -boss.r * 2 + ((w - h) / 2), w, h);
                ctx.rotate((36 * Math.PI) / 180);
              }
            ctx.restore();
          }
          if (img.tenBody) {
            ctx.save();
              let factor = 1 - Math.min(10, Math.max(0, Math.ceil(boss.time))) / 10;
              let brightnessVal = 200 - (150 * factor);
              ctx.filter = `brightness(${brightnessVal}%)`;
              ctx.drawImage(img.tenBody, boss.x - boss.r * 2, boss.y - boss.r * 2, boss.r * 4, boss.r * 4);
            ctx.restore();
          }
          else console.error("Ten's body doesn't exist!")
          if (img.Numbers10) {

                let sy = row * tileSize;

                  sx, sy, tileSize, tileSize, 
                  boss.x - drawSize / 2, boss.y - drawSize / 2, drawSize, drawSize
                );

        };

        ctx.translate(0, -100)
      }
      ctx.restore();
    }

    function loop() {
      permState.clock++;
      if (permState.menu === "main") {
        draw();
        loopId = requestAnimationFrame(loop);
        return;
      }
      if (state.clicked || state.suprise) state.clock++;
      if (keys['w'] || keys['arrowup'])    state.cam.y += state.cam.speed;
      if (keys['s'] || keys['arrowdown'])  state.cam.y -= state.cam.speed;
      if (keys['a'] || keys['arrowleft'])  state.cam.x += state.cam.speed;
      if (keys['d'] || keys['arrowright']) state.cam.x -= state.cam.speed;
      if (state.bossRevealed) {
        state.rColorCD--;
        state.rMineCD--;
        if (state.rColorCD <= 0) {state.rColor = Math.random(); state.rColorCD = 5};
        if (state.rMineCD <= 0) {state.rMine = Math.floor(Math.random() * 1098 - 99); state.rMineCD = 6};
      }
      if (state.nine.active && state.nine.revealed) {
        const nineCell = state.grid[state.nine.row][state.nine.col];
        if (state.clicked || state.suprise) state.nine.timerCD--
        if (state.clicked) {
          state.nine.thinkCD--;
          state.nine.moveCD--;
        }
        if (state.nine.thinkCD <= 0) {
          state.nine.thinkCD = Math.random() * 130 + 20;
          let validDest = false;
          let attempts = 0;
          
          while (!validDest && attempts < 50) {
            attempts++;
            let dir = randomChoice(["row", "col"]);
            let targetCell = null;
            
            if (dir === "row") {
              let r = Math.floor(1 + Math.random() * (state.rows - 2));
              targetCell = state.grid[r]?.[nineCell.col];
            } else if (dir === "col") {
              let c = Math.floor(1 + Math.random() * (state.cols - 2));
              targetCell = state.grid[nineCell.row]?.[c];
            }
            
            if (targetCell) {
              state.nine.destination = targetCell;
              validDest = true;
            }
          }
        } else if (state.nine.moveCD <= 0) {
          state.nine.moveCD = 10;
          if (state.nine.destination && state.nine.destination.row === nineCell.row) {
            if (state.nine.destination.col > nineCell.col) state.nine.move("right");
            else if (state.nine.destination.col < nineCell.col) state.nine.move("left");
          } else if (state.nine.destination && state.nine.destination.col === nineCell.col) {
            if (state.nine.destination.row > nineCell.row) state.nine.move("down");
            else if (state.nine.destination.row < nineCell.row) state.nine.move("up");
          }
        }
        if (state.nine.timerCD <= 0 && (state.clicked || state.suprise) && !state.won) {state.nine.timer--; state.nine.timerCD = 60 - (state.fails * (60 / 9));}
        for (let i in mus) {
          if (!i.includes("Win") && !i.includes("Intro")) mus[i].playbackRate = 1.0 + (state.fails * (60 / 9) / 60);
        } 
        if (state.nine.timer <= 0) gameOver();
      }
      if (state.ten.active) {
        for (let i=0; i<state.ten.amount; i++) {
          const boss = state.ten.tens[i];
          if (state.clicked && !boss.activated) boss.activated = true
          if (boss.activated && !state.over && !boss.debug) boss.time -= (1 + state.fails * 0.1)/60;
          if (boss.time < 4 && boss.time > 0 && boss.beepcd <= 0) {play("tenBeep"); boss.beepcd = Math.max(Math.floor(boss.time) * 10, 4)};
          boss.beepcd--;
          if (boss.time <= 0 && !state.lost) gameOver();
          moveAtAngle(boss, boss.angle, boss.speed);

          if (boss.x - boss.r <= 0) {
            boss.x = boss.r;
            boss.angle = Math.PI - boss.angle; 
            play("tenBounce")
            state.shake += 5;
          } else if (boss.x + boss.r >= canvas.width) {
            boss.x = canvas.width - boss.r;
            boss.angle = Math.PI - boss.angle;
            play("tenBounce")
            state.shake += 5;
          }; if (boss.y - boss.r <= 0) {
            boss.y = boss.r;
            boss.angle = -boss.angle; 
            play("tenBounce")
            state.shake += 5;
          } else if (boss.y + boss.r >= canvas.height) {
            boss.y = canvas.height - boss.r;
            boss.angle = -boss.angle;
            play("tenBounce")
            state.shake += 5;
          }
        }
      }
      if (state.eleven.active) {
        if (state.clicked || state.suprise) state.eleven.moveCD--;
        if (state.eleven.moveCD <= 0 && !state.over) {
          state.eleven.move();
          state.eleven.moveCD = state.eleven.penalty ? 20 : 360;
          if (state.eleven.penalty > 0) state.eleven.penalty--;
        }
        if (state.minesLeft <= 0) gameOver();
      }
      
      draw();
      loopId = requestAnimationFrame(loop);
    }

    async function init() {
      for (let i in mus) {
        mus[i].pause();
        mus[i].currentTime = 0; 
      } 
      state = { 
        get mouse() {return permState.mouse},
        set mouse(val) {permState.mouse = val},
        cam: {
          x: 0,
          y: 0,
          zoom: 1.0,
          speed: 10,
        },
        grid: [],
        cols: 13,
        rows: 13,
        get cellSize() {
          return Math.max(40, Math.floor(1200 / this.cols))
        },
        mines: 29,
        antiProb: 0,
        doubleProb: 0,
        get flags() {
          return this.doubleProb > 0 ? 2 : 1;
        },
        get minesLeft() {
          if (state.nine.revealed) return this.rMine;
          else if (state.nine.active && !state.nine.revealed) return "???";
          let m = this.mines;
          for (let i = 0; i < state.rows; i++) {
            if (!state.grid[i]) continue;
            for (let j = 0; j < state.cols; j++) {
              if (!state.grid[i][j]) continue;
              const cell = state.grid[i][j];
              if (cell.flagged) m--;
            }
          }
          if (state.eleven.active) m += state.eleven.handicap;
          return m
        },
        rMine: null,
        rMineCD: 0,
        debug: false,
        
        chording: true,
        firstClick: 3, // 3, 1, or 0
        livesColor: function(val, max = 3, min = 1) {
          if (val < 1 && !state.boss) return charcoal;
          const ratio = this.bossRevealed ? this.rColor : (Math.max(min, Math.min(val, max)) - min) / (max - min);
          const h = ratio * 120;
          const s = 1;
          const l = 0.5;
          const c = (1 - Math.abs(2 * l - 1)) * s;
          const x = c * (1 - Math.abs((h / 60) % 2 - 1));
          const m = l - c / 2;
          let r = 0, g = 0, b = 0;
          if (0 <= h && h < 60) {
            r = c; g = x; b = 0;
          } else if (60 <= h && h < 120) {
            r = x; g = c; b = 0;
          } else if (120 <= h && h < 180) {
            r = 0; g = c; b = x;
          }
          const semifinal = {
            r: Math.round((r + m) * 255),
            g: Math.round((g + m) * 255),
            b: Math.round((b + m) * 255),
          }
          let final = {};
          for (let i in semifinal) {
            const hex = semifinal[i].toString(16);
            final[i] = hex.length === 1 ? "0" + hex : hex;
          }     
          
          return `#${final.r}${final.g}${final.b}`;         
        },
        rColor: null,
        rColorCD: 0,

        get coins() {return permState.coins},
        set coins(val) {permState.coins = val;},

        get mode() {return permState.mode},
        set mode(val) {permState.mode = val;},

        get lives() {return permState.lives},
        set lives(val) {permState.lives = val;},

        get stage() {return permState.stage},
        set stage(val) {permState.stage = val;},
        bgm: "one",
        clicked: false,
        fails: 0,
        won: false,
        lost: false,
        get over() {
          return this.won || this.lost
        },
        pressedCell: null,
        clock: 0,
        sonar: false,
        sonarCost: 50,
        useSonar: function() {
          if (this.nine.active || this.coins < this.sonarCost) return;
          this.sonar = toggle(this.sonar);
          play('sonarClick')
        },
        shake: 0,
        shakeDir: false,

        get boss() {
          return this.nine.active || this.ten.active || this.eleven.active
        },
        get bossRevealed() {
          return this.nine.revealed || this.ten.revealed || this.eleven.revealed
        },
        suprise: false,
        nine: new bossNine(),
        ten: {
          active: false,
          amount: 1,
          revealed: 0,
          tens: [],
        },
        eleven: {
          active: false,
          revealed: false,
          handicap: -11,
          row: null,
          col: null,
          penalty: 0,
          lastPenalty: 1, 
          move: function() {
            let opened = 0;
            for (let i = 0; i < state.rows; i++) {
              if (!state.grid[i]) continue;
              for (let j = 0; j < state.cols; j++) {
                if (!state.grid[i][j]) continue;
                if (!state.grid[i][j].opened) opened++;
              }
            }
            if (opened === 0) {gameOver(); return;}
            
            let found = false;
            while (!found) {
              const r = Math.floor(Math.random() * state.rows);
              const c = Math.floor(Math.random() * state.cols);
              if (!state.grid[r]?.[c]) return;
              const target = state.grid[r][c];
              if (!target.opened && !target.flagged) found = target;
            }
            found.flag();
          },
        },
      }

      let nullCells = [];
       try {
        const response = await fetch('cutouts/9beginner.json');
        if (response.ok) {
          nullCells = await response.json();
        } else {
          console.warn("It appears the rock came before the scissors.");
        }
      } catch (err) {
        console.error("The scissors haven't arrived yet. They have sent you a message though: ", err);
      }

      for (let r = 0; r < state.rows; r++) {
        state.grid[r] = [];
        for (let c = 0; c < state.cols; c++) {
          state.grid[r][c] = {
            row: r,
            col: c,
            opened: false,
            flagged: 0,
            mine: false,
            anti: false,
            hit: false,
            open: function() {
              openCell(this);
            },
            flag: function() {
              flagCell(this);
            }
          };
        }
      }
      nullCells.forEach(c => {
        if (state.grid[c.row]) state.grid[c.row][c.col] = null;
      });
      for (let i=0; i<state.ten.amount; i++) {
        state.ten.tens[i] = new bossTen();
      }
      if (!state.suprise && state.boss) {
        if (state.eleven.active) state.bgm = "one";
        else if (state.ten.active) state.bgm = "five";
        else if (state.nine.active) state.bgm = "one";
      } else if (state.suprise && state.boss) {
        if (state.eleven.active) state.bgm = "eleven";
        else if (state.ten.active) state.bgm = "ten";
        else if (state.nine.active) state.bgm = "nine";
      } else state.bgm =  randomChoice(["one", "two", "three", "four", "five", "six", "seven", "eight"]);
      if (state.suprise) {
        if (state.nine.active) state.nine.reveal();
        if (state.ten.active) for (let i=0; i<state.ten.amount; i++) state.ten.tens[i].reveal();
        if (state.eleven.active) state.eleven.reveal();
      } else if (state.boss) {
        mus.zero.play();
      }
      if (state.suprise && state.nine.active && state.ten.active && !state.eleven.active) mus.ten2.play();
      else if (!state.suprise && !state.boss) mus[state.bgm].play();
      
      const gridW = state.cols * state.cellSize;
      const gridH = state.rows * state.cellSize;
      const availableW = canvas.width - 100;
      const availableH = canvas.height - 180;
      const zoomX = availableW / gridW;
      const zoomY = availableH / gridH;

      state.cam.zoom = Math.min(zoomX, zoomY);
      state.cam.x = canvas.width / 2 - gridW / 2;
      state.cam.y = (canvas.height + 100) / 2 - (gridH / 2 + 100);
      permState.menu = "game";
    }

    function start() {
      state = {};
      permState.menu = "main";
      canvas.width = 1366;
      canvas.height = 768;
      if (!started) loop();
      started = true;
      mus.oneMenu.play();
    }
    ctx.font = "72px serif"
    ctx.fillText("Click the canvas to start the game!", 10, canvas.height / 2);
  </script>
</html>
