    function invert(color) {
        const invertHexComponent = (hex) => {
            const inverted = 255 - parseInt(hex, 16);
            return inverted.toString(16).padStart(2, '0');
        };

        color = color.trim();

        if (color.toLowerCase().includes('rgb') || color.includes(',')) {
            const rgbMatch = color.match(/\d+/g);
            if (!rgbMatch || rgbMatch.length < 3) throw new Error("Invalid RGB format");
            
            const r = 255 - parseInt(rgbMatch[0], 10);
            const g = 255 - parseInt(rgbMatch[1], 10);
            const b = 255 - parseInt(rgbMatch[2], 10);
            
            return `rgb(${r}, ${g}, ${b})`;
        }

        let hex = color.replace('#', '');

        if (hex.length === 3) {
            hex = hex.split('').map(char => char + char).join('');
        }

        if (hex.length !== 6) throw new Error("Invalid HEX format");

        const r = invertHexComponent(hex.slice(0, 2));
        const g = invertHexComponent(hex.slice(2, 4));
        const b = invertHexComponent(hex.slice(4, 6));

        return `#${r}${g}${b}`;
    }


    function circle(x, y, r, c, s = null, f = 2) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      
      if (c) {
        ctx.fillStyle = c;
        ctx.fill();
      }

      if (s) {
        ctx.strokeStyle = s;
        ctx.lineWidth = f;
        ctx.stroke();
      }
    }

    function rect(x, y, w, h, c, s = null, f = 2) {
      if (c) {
        ctx.fillStyle = c;
        ctx.fillRect(x, y, w, h);
      }

      if (s) {
        ctx.strokeStyle = s;
        ctx.lineWidth = f;
        ctx.strokeRect(x, y, w, h);
      }
    }

    function rect2(x, y, w, h, c, s = null, f = 2) {

      }

      if (s) {

      }
    }

    function text(t, x, y, c, size, family, align, baseline, sc, sw = 3, weight) {
      ctx.textAlign = align ? align : "left";
      ctx.textBaseline = baseline ? baseline : "alphabetic";
      ctx.font = `${weight ? weight : ""} ${size}px ${family ? family : "serif"}`;
      
      if (sc) {
        ctx.strokeStyle = sc;
        ctx.lineWidth = sw;
        ctx.strokeText(t, x, y);
      }
      
      if (c) {
        ctx.fillStyle = c;
        ctx.fillText(t, x, y);
      }
    }

    // Angles & Distance

    function getDistance(entity1, entity2) {
        const dx = entity2.x - entity1.x;
        const dy = entity2.y - entity1.y;
        return Math.sqrt(dx * dx + dy * dy);
    }

    function moveToward(follower, target, speed) {
        const dx = target.x - follower.x;
        const dy = target.y - follower.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        
        if (distance > speed) {
            follower.x += (dx / distance) * speed;
            follower.y += (dy / distance) * speed;
        } else {
            follower.x = target.x;
            follower.y = target.y;
        }
    }

    function moveAtAngle(entity, angle, speed) {
        entity.x += Math.cos(angle) * speed;
        entity.y += Math.sin(angle) * speed;
    }

    function checkCircleCollision(c1, c2) {
        const dx = c1.x - c2.x;
        const dy = c1.y - c2.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        
        return distance < (c1.r + c2.r);
    }

    function checkRectCollision(r1, r2) {
        return r1.x < r2.x + r2.w &&
              r1.x + r1.w > r2.x &&
              r1.y < r2.y + r2.h &&
              r1.y + r1.h > r2.y;
    }

    function checkCircleRectCollision(circle, rect) {
        const closestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.w));
        const closestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.h));

        const dx = circle.x - closestX;
        const dy = circle.y - closestY;
        const distance = Math.sqrt(dx * dx + dy * dy);

        return distance < circle.r;
    }

    function randomNumber(min, max, int = false) {
        if (int) return Math.floor(Math.random() * (max - min + 1)) + min;
        return Math.random() * (max - min) + min;
    }

    // arr should be an array (e.g. [blue, red, green])
    function randomChoice(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function clamp(val, min, max) {
        return Math.max(min, Math.min(max, val));
    }
    
    function lerp(start, end, factor) {
        return start + (end - start) * factor;
    }


    function getAngle(entity1, entity2) {
        return Math.atan2(entity2.y - entity1.y, entity2.x - entity1.x);
    }

    // Conversions

    function degToRad(degrees) {
        return degrees * (Math.PI / 180);
    }

    function radToDeg(radians) {
        return radians * (180 / Math.PI);
    }

    function hexToRGBA(hex, alpha = 0) {
        hex = hex.replace('#', '');
        const r = parseInt(hex.substring(0, 2), 16);
        const g = parseInt(hex.substring(2, 4), 16);
        const b = parseInt(hex.substring(4, 6), 16);
        
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function toggle(boo) {
      return !boo;
    }

    function getGridAssetList() {
      let paths = [];
      const episodes = [1, 2, 3]; // episode 3 let's gooo
      const diffs = [0, 1, 2, 3];
      
      for (let ep of episodes) {
        let maxStages = (ep === 3) ? 11 : (ep === 2 ? 10 : 9);
        for (let i = 1; i <= maxStages; i++) {
          for (let diff of diffs) {
            paths.push(`bitmap/${ep}_${i}_${diff}.png`);
            if (i === 8 + ep && ep > 1 && diff > 0) {

      paths.push('grids/test.json'); // just in case...
      return paths;
    }
    const gridPaths = getGridAssetList();

    async function parseBitmapToGridData(episode, stage, diff, phase2) {
      const fileName = `${episode}_${stage}_${diff}${phase2 ? '_2' : ''}.png`;
      const imgPath = `bitmap/${fileName}`;

      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = imgPath;
        
        img.onload = () => {
          const cols = img.width;
          const rows = img.height;
          const canvas = document.createElement('canvas');
          canvas.width = cols;
          canvas.height = rows;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);

          const imgData = ctx.getImageData(0, 0, cols, rows).data;
          
          let gridData = {
              rows: rows,
              cols: cols,
              mines: advGrids?.mines?.[episode - 1]?.[stage - 1]?.[diff] ?? 40,
              timer: advGrids?.timer?.[episode - 1]?.[stage - 1]?.[diff] ?? 99,
              cutout: [],
              borders: []
          };

          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const idx = (r * cols + c) * 4;
              const green = imgData[idx + 1];
              const blue = imgData[idx + 2]; 

              if (blue !== 0) {
                  gridData.cutout.push({ row: r, col: c });
                  continue;
              }

              const g = green / 255.0;
              let bitmask = 0;
              let top = false, right = false, bottom = false, left = false;

              if (g > 0.03 && g <= 0.09) top = true;
              else if (g > 0.09 && g <= 0.15) right = true;
              else if (g > 0.15 && g <= 0.21) bottom = true;
              else if (g > 0.21 && g <= 0.27) left = true;
              else if (g > 0.27 && g <= 0.33) { top = true; right = true; }
              else if (g > 0.33 && g <= 0.39) { top = true; bottom = true; }
              else if (g > 0.39 && g <= 0.45) { top = true; left = true; }
              else if (g > 0.45 && g <= 0.51) { right = true; bottom = true; }
              else if (g > 0.51 && g <= 0.57) { right = true; left = true; }
              else if (g > 0.57 && g <= 0.63) { bottom = true; left = true; }
              else if (g > 0.63 && g <= 0.69) { top = true; right = true; bottom = true; }
              else if (g > 0.69 && g <= 0.75) { top = true; right = true; left = true; }
              else if (g > 0.75 && g <= 0.81) { top = true; bottom = true; left = true; }
              else if (g > 0.81 && g <= 0.87) { right = true; bottom = true; left = true; }
              else if (g > 0.87 && g <= 1.0)  { top = true; right = true; bottom = true; left = true; }

              if (top) bitmask |= 8;
              if (right) bitmask |= 4;
              if (bottom) bitmask |= 2;
              if (left) bitmask |= 1;

              if (bitmask > 0) {
                gridData.borders.push({ row: r, col: c, val: bitmask });
              }
            }
          }
          resolve(gridData);
        };
        img.onerror = (err) => reject(err);
      });
    }

    async function handleLocalGridFolder(e) {
      const files = e.target.files;

        localGridFiles[file.name] = file;
        localGridFiles[file.webkitRelativePath] = file;

      logToConsole(`[System] Processing ${files.length} local files...`);

      let missingGridsCount = 0;

        if (!loadedGrids[path]) {
          let fileName = path.split('/').pop();
          let match = localGridFiles[fileName] || localGridFiles[path] || localGridFiles[`grids/${fileName}`];

            try {
              const text = await match.text();
              loadedGrids[path] = JSON.parse(text);
              logToConsole(`Imported local grid: ${path}`);
            } catch (err) {
              logToConsole(`[ERROR] Failed to parse local grid ${path}`, true);
              missingGridsCount++;
            }
          } else {
            missingGridsCount++;
          }
        }
      }

      if (missingGridsCount === 0) {
        gridErrors = false;
        document.getElementById('importGridsBtn').style.display = 'none';
        logToConsole("[System] All missing grids successfully loaded from folder!");
        finishLoading();
      } else {
        logToConsole(`[System] Still missing ${missingGridsCount} assets.`, true);
      }
    }

    class bossNine {
      constructor(active, timer)  {
        this.active = active;
        this.revealed = false;
        this.timer = timer;
        this.timerCD = 60;
        this.row = null;
        this.col = null;
        this.moveCD = 10;
        this.thinkCD = 0;
        this.destination = null;
      }

      get x() {
        return this.col * state.cellSize;
      };
      get y() {
        return this.row * state.cellSize;
      };
      cell(cell) {
        return this.row === cell.row && this.col === cell.col && state.nine.active; 
      };
      click() {
        if (!state.clicked) placeMines();
        if (checkWin()) gameOver(true);
        else gameOver(false);
      };
      move(dir, test) {
        let oldFlags = [];
        state.grid[this.row][this.col].opened = false;
        state.grid[this.row][this.col].flagged = false;
        state.grid[this.row][this.col].mine = true;
        for (let i = this.row - 1; i <= this.row + 1; i++) {
          if (!state.grid[i]) continue;
          const r = i - this.row + 1;
          oldFlags[r] = [];
          for (let j = this.col - 1; j <= this.col + 1; j++) {
            if (!state.grid[i][j] || this.cell(state.grid[i][j])) continue;
            const c = j - this.col + 1;
            state.grid[i][j].mine = 0; 
            oldFlags[r][c] = state.grid[i][j].flagged;
            state.grid[i][j].flagged = false;
          }
        }
        let oob = false;
        for (let i=-1; i<=1; i++) {
          if (dir === "left") {
            const moving = state.grid[this.row + i]?.[this.col - 2];
            if (!moving) {
              oob = true;
              break;
            }
            const target = state.grid[this.row + i]?.[this.col + 1];
            target.opened = moving.opened;
            target.mine = moving.mine;
            if (!moving.mine) moving.flagged = false;
          } else if (dir === "right") {
            const moving = state.grid[this.row + i]?.[this.col + 2];
            if (!moving) {
              oob = true;
              break;
            }
            const target = state.grid[this.row + i]?.[this.col - 1];
            target.opened = moving.opened;
            target.mine = moving.mine;
            if (!moving.mine) moving.flagged = false;
          } else if (dir === "down") {
            const moving = state.grid[this.row + 2]?.[this.col + i];
            if (!moving) {
              oob = true;
              break;
            }
            const target = state.grid[this.row - 1]?.[this.col + i];
            target.opened = moving.opened;
            target.mine = moving.mine;
            if (!moving.mine) moving.flagged = false;
          } else if (dir === "up") {
            const moving = state.grid[this.row - 2]?.[this.col + i];
            if (!moving) {
              oob = true;
              break;
            }
            const target = state.grid[this.row + 1]?.[this.col + i];
            target.opened = moving.opened;
            target.mine = moving.mine;
            if (!moving.mine) moving.flagged = false;
          } else console.warn(`Nine, you know that ${dir} isn't a direction, right?`)
        }
        if (oob) {
          this.destination = null;
          this.thinkCD = 0;
        } else {
          if (dir === "left") this.col--;
          else if (dir === "right") this.col++;
          else if (dir === "up")  this.row--;
          else if (dir === "down") this.row++;
        }
        for (let i = this.row - 1; i <= this.row + 1; i++) {
          if (!state.grid[i]) continue;
          const r = i - this.row + 1;
          for (let j = this.col - 1; j <= this.col + 1; j++) {
            if (!state.grid[i][j]) continue;
            const c = j - this.col + 1
            state.grid[i][j].mine = 1; 
            state.grid[i][j].opened = false;
            state.grid[i][j].flagged = oldFlags[r][c];
          }
        }

        if (oob) return;
        if (state.grid[this.row][this.col] === this.destination) play("nineStop");
        else play("nineMove");
        state.shake += 1
      };
    
      reveal(cell) {
        this.row = cell ? cell.row : Math.floor(state.rows / 2);
        this.col = cell ? cell.col : Math.floor(state.cols / 2);

        this.revealed = true; 
        for (let i = this.row - 1; i <= this.row + 1; i++) {
          if (!state.grid[i]) continue;
          for (let j = this.col - 1; j <= this.col + 1; j++) {
            if (!state.grid[i][j] || i === this.row && j === this.col) continue;
            state.grid[i][j].mine = 1; 
          }
        }
        for (let i in mus) {
          mus[i].pause();
          mus[i].currentTime = 0; 
        }  
        if (!state.suprise) mus.nineIntro.play();
        state.bgm = "nine";
      } 
    }

    function openCell(cell, comeFromChord = false, comeFromSpread = false) {
      if (!cell) return;
      if (cell.flagged || (comeFromChord && cell.opened)) return;
      if (cell.opened) {
        if (settings.chording && !comeFromSpread) chordCell(cell, comeFromSpread);
        return;
      };
      
      if (state.sonar) { 
        play("sonar");
        state.sonar = false;
        state.coins -= state.sonarCost;
        state.sonarCost += 50
        if (cell.mine) {
          cell.flag();
          return;
        }
      }
      
      if (cell.mine) {
        cell.flagged = cell.mine;
        cell.hit = cell.mine;
        if (state.boss) state.fails++;
        else if (permState.shields) permState.shields--;
        else state.lives--;
        play("mine")
        state.shake += 30;
        if (state.eleven.active) {
          state.eleven.lastPenalty += 2;
          state.eleven.penalty += state.eleven.lastPenalty;
        };
        if (state.lives <= 0 && !state.boss) gameOver();
      };
      cell.opened = true;
      
      if (cellValue(cell, false, true) === 0) {
        const r = cell.row;
        const c = cell.col;
        for (let i = r - 1; i <= r + 1; i++) {
          if (!state.grid[i]) continue;
          for (let j = c - 1; j <= c + 1; j++) {
            const neighbor = state.grid[i][j];
            if (!state.grid[i][j] || !canSee(cell, neighbor)) continue;
            openCell(neighbor, false, true);
          }
        }
      }
      if (checkWin() && !state.nine.active) gameOver(true);
    }
    
    function chordCell(cell, comeFromSpread = false) {
      // why are antis so hard to code :<
      const visMines = cellValue(cell, false, false);
      const absMines = cellValue(cell, false, true);
      const visFlags = cellValue(cell, true, false);
      const absFlags = cellValue(cell, true, true);
      const m = comeFromSpread && visMines === 0 ? absMines : visMines;
      const f = comeFromSpread && visMines === 0 ? absFlags : visFlags;

      if (f !== m || cell.flagged) return;

      const r = cell.row;
      const c = cell.col;
      for (let i = r - 1; i <= r + 1; i++) {
        for (let j = c - 1; j <= c + 1; j++) {
          if (!state.grid[i]?.[j]  || !canSee(cell, state.grid[i][j])) continue;
          openCell(state.grid[i][j], true);
        }
      }
    }

    function flagCell(cell) {
      if (cell.opened) return;
      cell.flagged += cell.flagged < 0 ? -1 : 1;
      if (state.antiProb >= 1 && cell.flagged > 0) cell.flagged = -1;
      if (state.doubleProb >= 1) {
        cell.flagged *= 2;
      }
      if (cell.flagged > state.flags || cell.flagged < -state.flags) {
        if (state.antiProb > 0 && cell.flagged > state.flags) cell.flagged = -1;
        else cell.flagged = 0;
        if (state.doubleProb >= 1) cell.flagged *= 2;
      }
      if (cell.flagged === 0) {
        play("unflag");
        if (state.eleven.active && cell.mine) cell.open();
      }
      else play("flag");
    } 

    function checkWin() {
      for (let i = 0; i < state.rows; i++) {
        for (let j = 0; j < state.cols; j++) {
          const cell = state.grid[i]?.[j];
          if (!cell || cell.mine) continue;
          if (!cell.opened) return false;
        }
      }
      return true;
    }

    function gameOver(win = false) {
      if (state.over) return;
      if (win) state.won = true;
      else state.lost = true;
      if (state.ten.active) for (let i=0; i<state.ten.amount; i++) state.ten.tens[i].time = win ? 10 : 0;
      for (let i in mus) {
        mus[i].pause();
        mus[i].currentTime = 0; 
      }  
      if (state.won) mus[state.bgm + "Win"].play();
      state.completionTime = state.clock;

      for (let i = 0; i < state.rows; i++) {
        if (!state.grid[i]) continue;
        for (let j = 0; j < state.cols; j++) {
          if (!state.grid[i][j]) continue;
          const cell = state.grid[i][j];
          if (state.won && cell.mine && !cell.flagged) cell.flagged = cell.mine;
          if (state.lost && cell.mine && !cell.flagged) cell.opened = true;
        }
      }

      if (permState.mode === "adv") {
        if (!state.lost) {
          permState.coins += 100;
        }
      }
      const gridW = state.cols * state.cellSize;
      const gridH = state.rows * state.cellSize;
      const availableW = canvas.width - 100;
      const availableH = canvas.height - 180;

      state.cam.zoom = Math.min(availableW / gridW, availableH / gridH);
      state.cam.x = canvas.width / 2 - gridW / 2;
      state.cam.y = (canvas.height + 100) / 2 - (gridH / 2 + 100);
    }

    function cellValue(cell, flags = false, anti = false) {
      if (!cell || (!cell.opened && !cell.flagged)) return "";
      if (state.nine.active && cell === state.grid[state.nine.row][state.nine.col]) return 9;
      if (cell.mine && cell.opened) {
        let Xs = "";
        for (let i = 0; i < Math.abs(cell.mine); i++) Xs += "X";
        return Xs;
      }
      if (cell.flagged) {
        let Fs = "";
        for (let i = 0; i < Math.abs(cell.flagged); i++) Fs += "F";
        return Fs;
      }
      
      const r = cell.row;
      const c = cell.col;
      let count = 0;
      for (let i = r - 1; i <= r + 1; i++) {
        if (!state.grid[i]) continue;
        for (let j = c - 1; j <= c + 1; j++) {
          const neighbor = state.grid[i][j];
          if (!neighbor || neighbor === cell || (settings.undermine && neighbor.hit) || (!canSee(cell, neighbor) && flags && !anti)) continue;
          if (anti) {
            if (neighbor.mine && !flags) count += Math.abs(neighbor.mine);
            else if (neighbor.flagged && flags) count += Math.abs(neighbor.flagged);
          } else {
            if (neighbor.mine && !flags) count += neighbor.mine;
            else if (neighbor.flagged && flags) count += neighbor.flagged;
          }
        }
      }
      return count;
    }

    function canSee(cell, neighbor) {
      // Jorel, why did you make these anti-chording borders?!??!?!??
      if (!cell || !neighbor) return false;
      
      const r1 = cell.row;
      const c1 = cell.col;
      const r2 = neighbor.row;
      const c2 = neighbor.col;
      const rDiff = r2 - r1;
      const cDiff = c2 - c1;

      if (rDiff === -1 && cDiff === 0 && cell.borders?.top) return false;
      if (rDiff === 1 && cDiff === 0  && cell.borders?.bottom) return false;
      if (rDiff === 0 && cDiff === -1 && cell.borders?.left) return false;
      if (rDiff === 0 && cDiff === 1  && cell.borders?.right) return false;

      if (rDiff === -1 && cDiff === -1) {
        const leftBlocked = cell.borders?.left && state.grid[r1 - 1]?.[c1]?.borders?.left;
        const topBlocked = cell.borders?.top && state.grid[r1]?.[c1 - 1]?.borders?.top;
        if (leftBlocked || topBlocked || (cell.borders?.top && cell.borders?.left) || (neighbor.borders?.bottom && neighbor.borders?.right)) return false;
      }
      if (rDiff === -1 && cDiff === 1) {
        const rightBlocked = cell.borders?.right && state.grid[r1 - 1]?.[c1]?.borders?.right;
        const topBlocked = cell.borders?.top && state.grid[r1]?.[c1 + 1]?.borders?.top;
        if (rightBlocked || topBlocked || (cell.borders?.top && cell.borders?.right) || (neighbor.borders?.bottom && neighbor.borders?.left)) return false;
      }
      if (rDiff === 1 && cDiff === -1) {
        const leftBlocked = cell.borders?.left && state.grid[r1 + 1]?.[c1]?.borders?.left;
        const bottomBlocked = cell.borders?.bottom && state.grid[r1]?.[c1 - 1]?.borders?.bottom;
        if (leftBlocked || bottomBlocked || (cell.borders?.bottom && cell.borders?.left) || (neighbor.borders?.top && neighbor.borders?.right)) return false;
      }
      if (rDiff === 1 && cDiff === 1) {
        const rightBlocked = cell.borders?.right && state.grid[r1 + 1]?.[c1]?.borders?.right;
        const bottomBlocked = cell.borders?.bottom && state.grid[r1]?.[c1 + 1]?.borders?.bottom;
        if (rightBlocked || bottomBlocked || (cell.borders?.bottom && cell.borders?.right) || (neighbor.borders?.top && neighbor.borders?.left)) return false;
      }

      const revRDiff = -rDiff;
      const revCDiff = -cDiff;
      if (revRDiff === -1 && revCDiff === 0 && neighbor.borders?.top) return false;
      if (revRDiff === 1 && revCDiff === 0  && neighbor.borders?.bottom) return false;
      if (revRDiff === 0 && revCDiff === -1 && neighbor.borders?.left) return false;
      if (revRDiff === 0 && revCDiff === 1  && neighbor.borders?.right) return false;

      return true;
    }

    function placeMines(cell) {
      if (!cell) return;
      if (state.clicked) return;
      state.clicked = true;
      if (!state.suprise && state.boss) {
        for (let i in mus) {
          mus[i].pause();
          mus[i].currentTime = 0; 
        }  
      }
         
      let m = state.nine.active ? 8 : 0;
      let stageCell = null;
      
      if (permState.mode === "adv" && permState.stage >= 1 && permState.stage <= 8) { 
        const targetNumber = permState.stage;
        let success = false;
        let attempts = 0;

        while (!success && attempts < 100) {
          attempts++;
          const r = Math.floor(Math.random() * (state.rows));
          const c = Math.floor(Math.random() * (state.cols));
          const stageTile = state.grid[r]?.[c];
          if (!stageTile) continue;
          
          stageTile.mine = false;
          stageCell = stageTile;
          
          let neighbors = [];
          for (let i = r - 1; i <= r + 1; i++) {
            if (!state.grid[i]) continue;
            for (let j = c - 1; j <= c + 1; j++) {
              const neighbor = state.grid[i][j];
              if ((i === r && j === c) || !state.grid[i][j]) continue;
              const isFirstClick = (Math.abs(i - cell.row) <= 1 && Math.abs(j - cell.col) <= 1);
              if (!isFirstClick) neighbors.push(neighbor);
            }
          }
          
          neighbors.sort(() => Math.random() - 0.5);
          if (neighbors.length < targetNumber) continue;
          else success = true;
          
          let placedCount = 0;
          for (let neighbor of neighbors) {
            if (placedCount < targetNumber) {
              neighbor.mine = 1;
              m++;
              placedCount++;
            }
          }
        }
      }
      
      while (m < state.mines) {
        const r = Math.floor(Math.random() * state.rows);
        const c = Math.floor(Math.random() * state.cols);
        const mine = state.grid[r]?.[c];
        if (!mine) continue;

        let near = Math.abs(r - cell.row) <= 1 && Math.abs(c - cell.col) <= 1;
        if ((state.rows <= 3 && state.cols <= 3) || settings.firstClick === 1) near = r === cell.row && c === cell.col
        if (state.rows * state.cols <= state.mines || settings.firstClick === 0) near = false;
        if (stageCell && Math.abs(r - stageCell.row) <= 1 && Math.abs(c - stageCell.col) <= 1) near = true;

        if (!mine.mine && !near) {
          mine.mine = Math.random() < state.doubleProb ? 2 : 1;
          if (Math.random() < state.antiProb) mine.mine = -mine.mine;
          m++;
        }
        if (!state.suprise && state.boss) mus[state.bgm].play();
      }
    }

    function loop() {
      if (!state) console.warn("Uh.. where is state???");
      const now = performance.now();
      const dt = Math.min(0.1, (now - lastDt) / 1000);
      lastDt = now;
      permState.fps = Math.round(1 / dt);
      permState.clock += dt * 60;
      if (state.sonar) state.sonarClock++;
      if (permState.menu !== "game") {
        permState.cam.x = lerp(permState.cam.x, menus[permState.menu].x, 0.1);
        permState.cam.y = lerp(permState.cam.y, menus[permState.menu].y, 0.1);
        draw();
        loopId = requestAnimationFrame(loop);
        return;
      }
      if (state.clicked || state.suprise) state.clock++;
      if (keys['w'] || keys['arrowup'])    state.cam.y += state.cam.speed;
      if (keys['s'] || keys['arrowdown'])  state.cam.y -= state.cam.speed;
      if (keys['a'] || keys['arrowleft'])  state.cam.x += state.cam.speed;
      if (keys['d'] || keys['arrowright']) state.cam.x -= state.cam.speed;
      if (state.bossRevealed) {
        state.rColorCD--;
        state.rMineCD--;
        if (state.rColorCD <= 0) {state.rColor = randomNumber(0, 3, true); state.rColorCD = 5};
        if (state.rMineCD <= 0) {state.rMine = Math.floor(Math.random() * 1098 - 99); state.rMineCD = 6};
      }
      if (state.nine.active && state.nine.revealed) {
        const nineCell = state.grid[state.nine.row][state.nine.col];
        if (state.clicked || state.suprise) state.nine.timerCD -= dt * 60
        if (state.clicked) {
          if (state.nine.destination && state.nine.cell(state.nine.destination)) state.nine.thinkCD--;
          state.nine.moveCD--;
        }
        if (state.nine.thinkCD <= 0) {
          let validDest = false;
          let attempts = 0;
          
          while (!validDest && attempts < 50) {
            attempts++;
            let dir = randomChoice(["row", "col"]);
            let targetCell = null;
            
            if (dir === "row") {
              let r = Math.floor(1 + Math.random() * (state.rows - 2));
              targetCell = state.grid[r]?.[nineCell.col];
            } else if (dir === "col") {
              let c = Math.floor(1 + Math.random() * (state.cols - 2));
              targetCell = state.grid[nineCell.row]?.[c];
            }
            
            if (targetCell) {
              validDest = true;
              for (let i = targetCell.row - 1; i <= targetCell.row + 1; i++) {
                for (let j = targetCell.col - 1; j <= targetCell.col + 1; j++) {
                  if (!state.grid[i]?.[j]) {validDest = false; break;};
                }
                if (!validDest) break;
              }
              if (validDest) {state.nine.destination = targetCell; state.nine.destDist = Math.abs(targetCell.row - nineCell.row) + Math.abs(targetCell.col - nineCell.col);}
              state.nine.thinkCD = state.nine.destDist ? 30 : state.nine.destDist * (0.4 - (permState.diff / 10)) * 60;
            }
          }
        } else if (state.nine.moveCD <= 0) {
          state.nine.moveCD = 10;
          if (state.nine.destination && state.nine.destination.row === nineCell.row) {
            if (state.nine.destination.col > nineCell.col) state.nine.move("right");
            else if (state.nine.destination.col < nineCell.col) state.nine.move("left");
          } else if (state.nine.destination && state.nine.destination.col === nineCell.col) {
            if (state.nine.destination.row > nineCell.row) state.nine.move("down");
            else if (state.nine.destination.row < nineCell.row) state.nine.move("up");
          }
        }
        if (state.nine.timerCD <= 0 && (state.clicked || state.suprise) && !state.won) {state.nine.timer--; state.nine.timerCD = 60 - (state.fails * (60 / 9));}
        for (let i in mus) {
          if (!i.includes("Win") && !i.includes("Intro")) mus[i].playbackRate = 1.0 + (state.fails * (60 / 9) / 60);
        } 
        if (state.nine.timer <= 0) gameOver();
      }
      if (state.ten.active) {
        for (let i=0; i<state.ten.amount; i++) {
          const boss = state.ten.tens[i];
          if (state.clicked && !boss.activated) boss.activated = true
          const timerSpeed = 1 / Math.max(0.1, 1.0 - (state.fails * 0.05));
          if (boss.activated && !state.over && !boss.debug) boss.time -= timerSpeed * dt;
          if (boss.time < 4 && boss.time > 0 && boss.beepcd <= 0) {play("tenBeep"); boss.beepcd = Math.max(Math.floor(boss.time) * 10, 4)};
          boss.beepcd--;
          if (boss.time <= 0 && !state.lost) gameOver();
          moveAtAngle(boss, boss.angle, boss.speed);

          if (boss.revealed) {
            if (boss.x - boss.r <= 0) {
              boss.x = boss.r;
              boss.angle = Math.PI - boss.angle; 
              play("tenBounce")
              state.shake += 5;
            } else if (boss.x + boss.r >= canvas.width) {
              boss.x = canvas.width - boss.r;
              boss.angle = Math.PI - boss.angle;
              play("tenBounce")
              state.shake += 5;
            }; if (boss.y - boss.r <= 0) {
              boss.y = boss.r;
              boss.angle = -boss.angle; 
              play("tenBounce")
              state.shake += 5;
            } else if (boss.y + boss.r >= canvas.height) {
              boss.y = canvas.height - boss.r;
              boss.angle = -boss.angle;
              play("tenBounce")
              state.shake += 5;
            }
          }
        }
      }
      if (state.eleven.active) {
        if (state.clicked || state.suprise) state.eleven.moveCD--;
        if (state.eleven.moveCD <= 0 && !state.over) {
          state.eleven.move();
          state.eleven.moveCD = state.eleven.penalty ? 20 : 360;
          if (state.eleven.penalty > 0) state.eleven.penalty--;
        }
        if (state.minesLeft <= 0) gameOver();
      }
      
      draw();
      loopId = requestAnimationFrame(loop);
    }

    function init(test = false) {
      for (let i in mus) {
        mus[i].pause();
        mus[i].currentTime = 0; 
        mus[i].playbackRate = 1.0;
      } 

      const gridKey = `bitmap/${permState.episode}_${permState.stage}_${permState.diff}.png`;
      let grid = test ? loadedGrids[`grids/test.json`] : loadedGrids[gridKey];

      if (!grid) {
        const epIdx = permState.episode - 1;
        const stageIdx = permState.stage - 1;
        const diffIdx = permState.diff;

        const fallbackRows = advGrids?.rows?.[epIdx]?.[stageIdx]?.[diffIdx] ?? 16;
        const fallbackCols = advGrids?.cols?.[epIdx]?.[stageIdx]?.[diffIdx] ?? 16;
        const fallbackMines = advGrids?.mines?.[epIdx]?.[stageIdx]?.[diffIdx] ?? 40;
        const fallbackTimer = advGrids?.timer?.[epIdx]?.[stageIdx]?.[diffIdx] ?? 99;

        grid = {
          rows: fallbackRows,
          cols: fallbackCols,
          mines: fallbackMines,
          timer: fallbackTimer,
          cutout: [],
          borders: []
        };
        logToConsole(`[Fallback] Built standard grid for Ep ${permState.episode}, Stage ${permState.stage}`);
      }

      state = { 
        get mouse() {return permState.mouse},
        set mouse(val) {permState.mouse = val},
        cam: {
          x: 0,
          y: 0,
          zoom: 1.0,
          speed: 10,
        },
        grid: [],
        cols: grid.cols,
        rows: grid.rows,
        get cellSize() {
          return Math.max(40, Math.floor(1200 / this.cols))
        },
        mines: grid.mines,
        antiProb: 0,
        doubleProb: 0,
        get flags() {
          return this.doubleProb > 0 ? 2 : 1;
        },
        get minesLeft() {
          if (state.nine.revealed) return this.rMine;
          else if (state.nine.active && !state.nine.revealed) return "???";
          let m = this.mines;
          for (let i = 0; i < state.rows; i++) {
            if (!state.grid[i]) continue;
            for (let j = 0; j < state.cols; j++) {
              if (!state.grid[i][j]) continue;
              const cell = state.grid[i][j];
              if (cell.flagged) m--;
            }
          }
          if (state.eleven.active) m += state.eleven.handicap;
          return m
        },
        rMine: null,
        rMineCD: 0,
        debug: false,
        rColor: null,
        rColorCD: 0,

        get coins() {return permState.coins},
        set coins(val) {permState.coins = val;},

        get mode() {return permState.mode},
        set mode(val) {permState.mode = val;},

        get lives() {return permState.lives},
        set lives(val) {permState.lives = val;},

        get stage() {return permState.stage},
        set stage(val) {permState.stage = val;},
        bgm: bgmNumbers[permState.stage],
        clicked: false,
        fails: 0,
        won: false,
        lost: false,
        get over() {
          return this.won || this.lost
        },
        pressedCell: null,
        clock: 0,
        sonar: false,
        sonarClock: 0,
        sonarCost: 50,
        useSonar: function() {
          if (this.nine.active || this.coins < this.sonarCost) return;
          this.sonar = toggle(this.sonar);
          play('sonarClick')
        },
        shake: 0,
        shakeDir: false,

        get boss() {
          return this.nine.active || this.ten.active || this.eleven.active
        },
        get bossRevealed() {
          return this.nine.revealed || this.ten.revealed || this.eleven.revealed
        },
        suprise: false,
        nine: new bossNine(permState.stage === 9 ? true : false, grid.timer),
        ten: {
          active: permState.stage === 10,
          amount: 1,
          revealed: 0,
          tens: [],
        },
        eleven: new bossEleven(),
      }

      for (let r = 0; r < state.rows; r++) {
        state.grid[r] = [];
        for (let c = 0; c < state.cols; c++) {
          state.grid[r][c] = {
            row: r,
            col: c,
            opened: false,
            flagged: 0,
            mine: false,
            anti: false,
            hit: false,
            open: function() {
              openCell(this);
            },
            flag: function() {
              flagCell(this);
            }
          };
        }
      }

      if (grid.cutout) {
        grid.cutout.forEach(c => {
          if (state.grid[c.row]) state.grid[c.row][c.col] = null;
        });
      }

      if (grid.borders) {
        grid.borders.forEach(b => {
          const cell = state.grid[b.row]?.[b.col];
          if (!cell) return;
          cell.borders = {
            top: (b.val & 8) !== 0,
            right: (b.val & 4) !== 0,
            bottom: (b.val & 2) !== 0,
            left: (b.val & 1) !== 0
          };
        });
      }

      if ((permState.episode === 2 && permState.stage <= 8) || (permState.episode === 3 && permState.stage % 2 === 0)) state.bgm = bgmAlt[state.bgm];
      console.log(state.bgm)

      for (let i=0; i<state.ten.amount; i++) {
        state.ten.tens[i] = new bossTen();
      }
      if (!state.suprise && state.boss) {
        if (state.eleven.active || state.nine.active) state.bgm = "one";
        else if (state.ten.active) state.bgm = "five";
      } else if (state.suprise && state.boss) {
        if (state.eleven.active) state.bgm = "eleven";
        else if (state.ten.active) state.bgm = "ten";
        else if (state.nine.active) state.bgm = "nine";
      } // else state.bgm =  randomChoice(["one", "two", "three", "four", "five", "six", "seven", "eight"]);
      if (state.suprise) {
        if (state.nine.active) state.nine.reveal();
        if (state.ten.active) for (let i=0; i<state.ten.amount; i++) state.ten.tens[i].reveal();
        if (state.eleven.active) state.eleven.reveal();
      } else if (state.boss) {
        mus.zero.play();
      }
      if (state.suprise && state.nine.active && state.ten.active && !state.eleven.active) mus.ten2.play();
      else if (!state.suprise && !state.boss) mus[state.bgm].play();
      
      const gridW = state.cols * state.cellSize;
      const gridH = state.rows * state.cellSize;
      const availableW = canvas.width - 100;
      const availableH = canvas.height - 180;

      state.cam.zoom = Math.min(availableW / gridW, availableH / gridH);
      state.cam.x = canvas.width / 2 - gridW / 2;
      state.cam.y = (canvas.height + 100) / 2 - (gridH / 2 + 100);
      permState.menu = "game";
    }

    function start() {
      state = {};
      permState.menu = "main";
      permState.coins = 1050;
      permState.continues = 0;
      permState.lives = 3;
      if (!started) loop();
      started = true;
      mus.oneMenu.play();
    }

    function startAdventure(ep) {
      permState.mode = "adv";
      permState.stage = 1;
      init();
    }
        
    function nextStage() {
      if (state.lost) {
        if (permState.continues === 0) permState.coins -= state.boss ? 10 : 100;
        else permState.coins -= permState.continues * (state.boss ? 20 : 200)
        permState.lives = 3;
        permState.continues++;
      } else {
        permState.stage++;
        if (permState.episode > 1 && permState.stage % 2 !== 0 && permState.stage <= 8) permState.shields++;
      }
      if (state.coins < 0 || permState.stage > 8 + permState.episode) start()
      else init();
    }
    text("Click here to start!", canvas.width / 2, canvas.height / 2, "#FFF", 72, "sans-serif", "center", "middle")
  </script><script src="https://cdnjs.cloudflare.com/ajax/libs/eruda/3.4.3/eruda.min.js"></script>
<script>eruda.init();</script>
